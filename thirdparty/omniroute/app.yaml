persistence:
  enabled: true
  mountPVC: true
  mountPath: /app/data
  name: omniroute-data
  storageClass: local-path
  storageSize: 5Gi

deployment:
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 60
  image:
    repository: diegosouzapw/omniroute
    tag: latest
    pullPolicy: Always
  containerSecurityContext: null

  ports:
    - name: http
      containerPort: 20128
      protocol: TCP

  env:
    DATA_DIR:
      value: /app/data
    INITIAL_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: omniroute-initial-password
          key: INITIAL_PASSWORD
    PORT:
      value: "20128"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # /healthz is the in-memory probe the image's own HEALTHCHECK uses;
  # /api/monitoring/health hits SQLite and flaps under load.
  startupProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 24

  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2

service:
  type: ClusterIP
  ports:
    - port: 20128
      name: http
      protocol: TCP
      targetPort: http

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: omniroute.dreadwrym.my.id
      paths:
        - path: /
          pathType: Prefix
  # ingress-shim creates the Certificate and its secret.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: omniroute-tls
      hosts:
        - omniroute.dreadwrym.my.id
