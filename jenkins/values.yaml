controller:
  numExecutors: 0
  jenkinsUrlProtocol: https
  ingress:
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: jenkins-forwarded-https@kubernetescrd
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.dreadwrym.my.id
  admin:
    password: admin
  resources:
    limits:
      memory: "2Gi"
  additionalPlugins:
    - pipeline-graph-view
    - pipeline-stage-view
    - matrix-auth
    - role-strategy
    - github-branch-source
    - theme-manager
    - catppuccin-theme
  JCasC:
    # Role assignments are the source of truth here: JCasC replaces the whole
    # role tree on every reload, so assign roles here, not in the UI.
    # Users can still be created in Manage Jenkins > Users.
    authorizationStrategy: |-
      roleBased:
        roles:
          global:
            - name: "admin"
              description: "Jenkins administrators"
              permissions:
                - "Overall/Administer"
              entries:
                - user: "admin"
            - name: "user"
              description: "Logged-in users: read-only dashboard, no job access"
              permissions:
                - "Overall/Read"
                - "View/Read"
              entries:
                - group: "authenticated"
          items:
            # Example: user alice can run only the job named example-pipeline.
            # Copy this block per pipeline. Pattern is an anchored regex.
            - name: "run-example-pipeline"
              description: "Run example-pipeline only"
              pattern: "^example-pipeline$"
              permissions:
                - "Job/Read"
                - "Job/Build"
              entries:
                - user: "alice"
additionalAgents:
  bun:
    podName: bun
    customJenkinsLabels: bun
    sideContainerName: bun
    image:
      repository: oven/bun
      tag: "1-alpine"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1", memory: "1Gi" }
  buildah:
    podName: buildah
    customJenkinsLabels: buildah
    sideContainerName: buildah
    image:
      repository: quay.io/buildah/stable
      tag: "v1.43.4"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    runAsUser: 1000
    runAsGroup: 1000
    yamlMergeStrategy: merge
    yamlTemplate: |-
      spec:
        securityContext:
          appArmorProfile:
            type: Unconfined
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "2", memory: "2Gi" }
    volumes:
      - type: Secret
        secretName: harbor-ci
        mountPath: /auth

persistence:
  size: 10Gi
