apiVersion: v1
kind: Namespace
metadata: 
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata: 
  name: nginx-html
  namespace: demo
data:
  index.html: |
    <html>
      <body> <h1> wasssap mein digga, ich bin configmap</hi> <body>
    </html
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts: 
            - name: html
              mountPath: /usr/share/nginx/html
      volumes: 
        - name: html
          configMap:
            name: nginx-html
        - name: data
          persistentVolumeClaim: 
            claimName: nginx-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: demo
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.dreadwrym.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80 
