domain: "https://vaultwarden.dreadwrym.my.id"

replicas: 1

database:
  type: default

storage:
  data:
    name: data
    size: 5Gi
    class: local-path
    path: /data
    keepPvc: true
    accessMode: ReadWriteOnce

strategy:
  type: RollingUpdate

signupsAllowed: false
signupsVerify: "false"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  class: traefik
  nginxIngressAnnotations: false
  hostname: vaultwarden.dreadwrym.my.id
  tls: true
  tlsSecret: vaultwarden-tls
