apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hdd-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hdd1-immich
spec:
  capacity:
    storage: 2700Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hdd-local
  local:
    path: /mnt/hdd1/immich
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [dreadwrym]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hdd-local
  volumeName: hdd1-immich
  resources:
    requests:
      storage: 2700Gi
