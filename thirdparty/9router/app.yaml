persistence:
  enabled: true
  mountPVC: true
  mountPath: /data
  name: 9router-data
  storageClass: local-path
  storageSize: 5Gi

deployment:
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 60
  image:
    repository: decolua/9router
    tag: latest
    pullPolicy: IfNotPresent
  containerSecurityContext: null

  ports:
    - name: http
      containerPort: 20128
      protocol: TCP

  env:
    DATA_DIR:
      value: /data
    INITIAL_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: 9router-initial-password
          key: INITIAL_PASSWORD
    PORT:
      value: "20128"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 24

  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2

service:
  type: ClusterIP
  ports:
    - port: 20128
      name: http
      protocol: TCP
      targetPort: http

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: 9router.dreadwrym.my.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: 9router-tls
      hosts:
        - 9router.dreadwrym.my.id
