apiVersion: v1
kind: Namespace
metadata:
  name: 9router
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 9router-data
  namespace: 9router
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
  labels:
    app: 9router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 9router
  template:
    metadata:
      labels:
        app: 9router
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: 9router
          image: decolua/9router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 9router-initial-password
                  key: INITIAL_PASSWORD
            - name: PORT
              value: "20128"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data
---
apiVersion: v1
kind: Service
metadata:
  name: 9router
  namespace: 9router
spec:
  type: ClusterIP
  selector:
    app: 9router
  ports:
    - name: http
      port: 20128
      protocol: TCP
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 9router
  namespace: 9router
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 9router.dreadwrym.my.id
      secretName: 9router-tls
  rules:
    - host: 9router.dreadwrym.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 9router
                port:
                  number: 20128
