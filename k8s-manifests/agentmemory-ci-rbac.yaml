# Identity used by the Jenkins terraform agent pod (see infra/jenkins/values.yaml).
# Also bootstraps the namespace Terraform deploys into.
apiVersion: v1
kind: Namespace
metadata:
  name: agentmemory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-agent
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-state
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-state
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraform-state
subjects:
  - kind: ServiceAccount
    name: terraform-agent
    namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-agent-admin
  namespace: agentmemory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: terraform-agent
    namespace: jenkins
