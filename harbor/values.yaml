expose:
  type: ingress
  tls:
    enabled: false
  ingress:
    hosts:
      core: harbor.dreadwrym.my.id
    className: traefik

externalURL: https://harbor.dreadwrym.my.id

harborAdminPassword: "admin"

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 10Gi
    jobservice:
      jobLog:
        size: 1Gi
    database:
      size: 2Gi
    redis:
      size: 1Gi
    trivy:
      size: 1Gi

trivy:
  enabled: true
