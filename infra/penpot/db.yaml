apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: penpot-postgresql
  namespace: penpot
spec:
  instances: 1
  bootstrap:
    initdb:
      database: penpot
      owner: penpot
      secret:
        name: penpot-postgres-user
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
