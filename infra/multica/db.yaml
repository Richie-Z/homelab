apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: multica-postgresql
  namespace: multica
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: multica
      owner: multica
      secret:
        name: multica-postgres-user
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
