controller:
  numExecutors: 0
  projectNamingStrategy:
    roleBased:
      forceExistingJobs: false
  jenkinsUrlProtocol: https
  ingress:
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: jenkins-forwarded-https@kubernetescrd
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.dreadwrym.my.id
  admin:
    password: admin
  resources:
    limits:
      memory: "2Gi"
  # Pin every plugin: an unpinned name resolves to the newest release at each
  # controller start. Keep these at versions that run on the pinned Jenkins image.
  additionalPlugins:
    - pipeline-graph-view
    - pipeline-stage-view
    - role-strategy
    - github-branch-source
    - job-dsl
    - theme-manager
    - catppuccin-theme
  overwritePlugins: true
  # Chart init reruns after a node reboot and `yes n | cp -i` exits 1 on the
  # surviving plugin emptyDir, so init crashloops. Skip init after first run.
  # Refresh plugins: delete /var/jenkins_home/initialization-completed first.
  initializeOnce: true
  JCasC:
    # Role assignments are the source of truth here: JCasC replaces the whole
    # role tree on every reload, so assign roles here, not in the UI.
    # Users can still be created in Manage Jenkins > Users.
    authorizationStrategy: |-
      roleBased:
        roles:
          global:
            - name: "admin"
              description: "Jenkins administrators"
              permissions:
                - "Overall/Administer"
              entries:
                - user: "admin"
            - name: "user"
              description: "Logged-in users: read-only dashboard, no job access"
              permissions:
                - "Overall/Read"
                - "View/Read"
              entries:
                - group: "authenticated"
            - name: "anonymous"
              description: "Unauthenticated read-only dashboard access"
              permissions:
                - "Overall/Read"
                - "View/Read"
              entries:
                - group: "anonymous"
          items:
            - name: "run-bench-check"
              description: "Run BenchCheck only"
              pattern: "^BenchCheck$"
              permissions:
                - "Job/Read"
                - "Job/Build"
              entries:
                - user: "test"
    # Seed job: scans apps/*/Jenkinsfile in this repo and creates one job per app.
    configScripts:
      seed-job: |
        jobs:
          - script: |
              pipelineJob('seed-apps') {
                description('Creates a pipeline job for every apps/*/Jenkinsfile in the homelab repo')
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/Richie-Z/homelab.git')
                        }
                        branch('*/master')
                      }
                    }
                    scriptPath('ci/seed-apps.jenkinsfile')
                  }
                }
                triggers {
                  scm('H/5 * * * *')
                }
              }
      job-dsl-security: |
        security:
          globalJobDslSecurityConfiguration:
            useScriptSecurity: false
agent:
  podRetention: "Never"
  garbageCollection:
    enabled: true
    timeout: 300
additionalAgents:
  bun:
    podName: bun
    customJenkinsLabels: bun
    sideContainerName: bun
    image:
      repository: oven/bun
      tag: "1-alpine"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    resources:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "1Gi" }
      limits: { cpu: "1", memory: "1Gi", ephemeral-storage: "5Gi" }
  buildah:
    podName: buildah
    customJenkinsLabels: buildah
    sideContainerName: buildah
    image:
      repository: quay.io/buildah/stable
      tag: "v1.43.4"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    runAsUser: 1000
    runAsGroup: 1000
    yamlMergeStrategy: merge
    yamlTemplate: |-
      spec:
        securityContext:
          appArmorProfile:
            type: Unconfined
          seccompProfile:
            type: Unconfined
    resources:
      requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "2Gi" }
      limits: { cpu: "4", memory: "4Gi", ephemeral-storage: "10Gi" }
    volumes:
      - type: Secret
        secretName: harbor-ci
        mountPath: /auth
  terraform:
    podName: terraform
    customJenkinsLabels: terraform
    sideContainerName: terraform
    image:
      repository: hashicorp/terraform
      tag: "1.16.6"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    # Kubernetes plugin writes PodTemplate.serviceAccount, which wins over a
    # yamlTemplate serviceAccountName. Set it here, not in yamlTemplate.
    serviceAccount: terraform-agent
    resources:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "1Gi" }
      limits: { cpu: "1", memory: "1Gi", ephemeral-storage: "5Gi" }

persistence:
  size: 10Gi
