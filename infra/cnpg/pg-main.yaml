apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  storage:
    size: 10Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"
