apiVersion: v1
kind: Pod
metadata:
  name: buildah-test
  namespace: jenkins
spec:
  restartPolicy: Never
  containers:
    - name: buildah
      image: quay.io/buildah/stable:latest
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        appArmorProfile:
          type: Unconfined
      resources:
        limits:
          memory: 2Gi
      volumeMounts:
        - name: harbor-auth
          mountPath: /auth
          readOnly: true
  volumes:
    - name: harbor-auth
      secret:
        secretName: harbor-ci
