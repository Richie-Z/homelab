global:
  domain: argocd.dreadwrym.my.id
  logging:
    format: json
  networkPolicy:
    create: false

crds:
  keep: true

configs:
  cm:
    application.resourceTrackingMethod: annotation
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    tls: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

controller:
  resources:
    requests: { cpu: 50m, memory: 256Mi }

repoServer:
  resources:
    requests: { cpu: 20m, memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 64Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }

dex:
  enabled: false

notifications:
  enabled: false
