controller:
  numExecutors: 0
  projectNamingStrategy:
    roleBased:
      forceExistingJobs: false
  jenkinsUrlProtocol: https
  image:
    tag: "2.580.1-jdk25"
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: jenkins-forwarded-https@kubernetescrd
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.dreadwrym.my.id
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.dreadwrym.my.id
  admin:
    password: admin
  resources:
    limits:
      memory: "2Gi"
  additionalPlugins:
    - pipeline-graph-view:1053.v9df19e6ceed2
    - pipeline-stage-view:2.41
    - role-strategy:927.v9cf5527c4085
    - github-branch-source:1986.v801e40614d00
    - theme-manager:346.v06cca_64c6a_37
    - catppuccin-theme:15.v3940ff14e600
  installLatestPlugins: false
  overwritePluginsFromImage: false
  JCasC:
    # Role assignments are the source of truth here: JCasC replaces the whole
    # role tree on every reload, so assign roles here, not in the UI.
    # Users can still be created in Manage Jenkins > Users.
    authorizationStrategy: |-
      roleBased:
        roles:
          global:
            - name: "admin"
              description: "Jenkins administrators"
              permissions:
                - "Overall/Administer"
              entries:
                - user: "admin"
            - name: "user"
              description: "Logged-in users: read-only dashboard, no job access"
              permissions:
                - "Overall/Read"
                - "View/Read"
              entries:
                - group: "authenticated"
            - name: "anonymous"
              description: "Unauthenticated read-only dashboard access"
              permissions:
                - "Overall/Read"
                - "View/Read"
              entries:
                - group: "anonymous"
          items:
            # Example: user alice can run only the job named example-pipeline.
            # Copy this block per pipeline. Pattern is an anchored regex.
            - name: "run-example-pipeline"
              description: "Run example-pipeline only"
              pattern: "^example-pipeline$"
              permissions:
                - "Job/Read"
                - "Job/Build"
              entries:
                - user: "alice"
agent:
  podRetention: "Never"
  garbageCollection:
    enabled: true
    timeout: 300
additionalAgents:
  bun:
    podName: bun
    customJenkinsLabels: bun
    sideContainerName: bun
    image:
      repository: oven/bun
      tag: "1-alpine"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    resources:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "1Gi" }
      limits: { cpu: "1", memory: "1Gi", ephemeral-storage: "5Gi" }
  buildah:
    podName: buildah
    customJenkinsLabels: buildah
    sideContainerName: buildah
    image:
      repository: quay.io/buildah/stable
      tag: "v1.43.4"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true
    runAsUser: 1000
    runAsGroup: 1000
    yamlMergeStrategy: merge
    yamlTemplate: |-
      spec:
        securityContext:
          appArmorProfile:
            type: Unconfined
          seccompProfile:
            type: Unconfined
    resources:
      requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "2Gi" }
      limits: { cpu: "2", memory: "2Gi", ephemeral-storage: "10Gi" }
    volumes:
      - type: Secret
        secretName: harbor-ci
        mountPath: /auth

persistence:
  size: 10Gi
