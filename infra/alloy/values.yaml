crds:
  create: false

alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  extraPorts:
    - name: gelf-udp
      port: 12201
      targetPort: 12201
      protocol: UDP
      hostPort: 12201
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.relabel "gelf" {
        forward_to = [loki.write.default.receiver]

        rule {
          source_labels = ["__gelf_message_host"]
          target_label  = "gelf_host"
        }
        rule {
          source_labels = ["__gelf_message_level"]
          target_label  = "gelf_level"
        }
        rule {
          source_labels = ["__gelf_message_facility"]
          target_label  = "gelf_facility"
        }
      }

      loki.source.gelf "gelf" {
        listen_address         = "0.0.0.0:12201"
        use_incoming_timestamp = true
        relabel_rules          = loki.relabel.gelf.rules
        forward_to             = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc:3100/loki/api/v1/push"
        }
      }
