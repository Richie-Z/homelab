apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc-config
  namespace: immich
data:
  frpc.toml: |
    serverAddr = "103.119.237.106"
    serverPort = 30045
    auth.method = "token"
    auth.token = "{{ .Envs.FRP_TOKEN }}"
    transport.tls.enable = true

    [[proxies]]
    name = "immich-https"
    type = "https"
    customDomains = ["immich.dreadwrym.my.id"]
    localIP = "traefik.kube-system.svc.cluster.local"
    localPort = 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frpc
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels: { app: frpc }
  template:
    metadata:
      labels: { app: frpc }
    spec:
      containers:
        - name: frpc
          image: fatedier/frpc:v0.71.1
          args: ["-c", "/etc/frp/frpc.toml"]
          env:
            - name: FRP_TOKEN
              valueFrom:
                secretKeyRef: { name: frp-token, key: token }
          volumeMounts:
            - { name: cfg, mountPath: /etc/frp }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: cfg
          configMap: { name: frpc-config }
