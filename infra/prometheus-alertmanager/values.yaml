resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

configmapReload:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

config:
  route:
    group_by: [alertname, namespace]

ingress:
  enabled: false
  className: traefik
  hosts:
    - host: alertmanager.dreadwrym.my.id
      paths:
        - path: /
          pathType: Prefix
